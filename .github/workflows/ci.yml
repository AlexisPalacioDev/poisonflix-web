name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build (includes tsc typecheck)
        run: npm run build
      - name: Test
        run: npm test

  music-worker-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches infra/music-worker/Dockerfile's python:3.12-slim base.
          python-version: "3.12"
      - name: Test (stdlib unittest, no extra deps)
        working-directory: infra/music-worker
        run: python -m unittest discover -s tests -v
