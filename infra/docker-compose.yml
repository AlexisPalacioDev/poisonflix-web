# poisonflix-web infra. The Caddy proxy is the single public entry point; the BFF
# is the only component that holds the *arr API keys and the only upstream the
# /prowlarr /radarr /sonarr /bff routes reach (see Caddyfile + bff/server.mjs).
services:
  caddy:
    image: caddy:2-alpine
    container_name: poisonflix-proxy
    restart: unless-stopped
    ports:
      - "8600:8600"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # ./www is the built web app (git-ignored build output). Deploy it with
      # infra/deploy.sh — do NOT hand-roll the swap.
      #
      # This comment used to read `npm run build && rm -rf infra/www && cp -r
      # dist infra/www`, and following it silently does nothing. Docker
      # resolves a bind mount to the inode it found at container start, so
      # replacing the directory leaves this container serving the deleted one
      # while the new files sit on disk unread. Measured: a browser on a fresh
      # profile was served the previous bundle for as long as the container
      # kept running — indistinguishable from a browser cache, and not one.
      # deploy.sh force-recreates Caddy for exactly this reason, then restarts
      # the Tailscale sidecar, which recreating Caddy would otherwise leave
      # pointing at a container that no longer exists.
      - ./www:/srv:ro
      # ./updates hosts the native APK self-update channel (version.json + apk),
      # served at /updates/*. Published by poisonflix's release.sh.
      - ./updates:/updates:ro
    networks:
      - jellyfin-server_default
      - media-automation
    depends_on:
      - bff

  # Auth-aware backend-for-frontend. Validates the caller's Jellyseerr session and
  # injects each *arr's X-Api-Key server-side, so no credential reaches the browser.
  bff:
    build: ./bff
    container_name: poisonflix-bff
    restart: unless-stopped
    # Real API keys + upstream URLs. Copy infra/env.example -> infra/.env first.
    env_file:
      - .env
    # MUSIC_WORKER_URL is a fixed internal address (not a secret), so it lives
    # here rather than in .env; the override merges the secret env on top.
    environment:
      MUSIC_WORKER_URL: http://music-worker:8790
      # "Modo gamer" reads the ROM library straight off the mount below — there
      # is no games-worker, because listing a directory and streaming a file
      # does not need its own container (see bff/games.mjs).
      GAMES_DIR: /games
      # "Ver en la tele". Unlike MUSIC_WORKER_URL this is NOT a fixed internal
      # address, and it cannot be one: cast-bridge runs on host networking and
      # therefore has no service name to resolve (see that service below). It is
      # reached at the docker GATEWAY — the host's own address on the bridge —
      # which differs per host and per network. Measured with
      # `docker network inspect media-automation`:
      #
      #   mendezserver (deploy target)  media-automation -> 172.19.0.1
      #   dev laptop                    media-automation -> 172.21.0.1
      #
      # Hence a variable rather than a constant. It is the SAME variable the
      # bridge binds to below, deliberately: two settings that must agree, kept
      # as one, because if they ever drift the symptom is an empty device list —
      # which is also what a LAN with no TVs looks like.
      #
      # Do not put CAST_BRIDGE_URL in .env expecting it to be read: compose's
      # `environment:` wins over `env_file:`, so it would look right and do
      # nothing (same trap env.example documents for GAMES_DIR). Set
      # CAST_GATEWAY_IP instead.
      CAST_BRIDGE_URL: http://${CAST_GATEWAY_IP:-172.19.0.1}:8791
    volumes:
      # Persists invite codes for self-service registration (see bff/invites.mjs).
      - ./bff/data:/data
      # The ROM library, read-only: the BFF only ever lists and streams it.
      # One subdirectory per system, named exactly as EmulatorJS names its
      # cores — nes, snes, psx, segaMD… — and anything else is ignored.
      #
      # `${DATA_DIR:?}` only catches an UNSET variable, and that is not the
      # failure that happens here: env.example ships DATA_DIR with a value, so
      # the realistic case is `$DATA_DIR/games` not existing yet — which Docker
      # then creates, empty and root-owned, leaving an empty shelf and every
      # health check green.
      #
      # `create_host_path: false` was tried here and REVERTED on purpose: it
      # works (the container refuses to start and names the path), but it makes
      # the whole BFF — auth, música, jam, and all three *arr proxies — refuse
      # to boot because an OPTIONAL feature's folder is missing. This service
      # already has a scar about a routine failure escalating into a
      # full-service outage (see the pipeline comment in server.mjs). The
      # silence is fixed where it belongs instead: games.mjs logs an
      # unreadable library, deploy.sh creates this directory deliberately, and
      # the deploy smoke test probes /bff/games/library.
      - ${DATA_DIR:?set DATA_DIR in infra/.env — host path whose games/ holds the ROM library}/games:/games:ro
    # media-automation: reaches jellyseerr/radarr/sonarr/prowlarr by name.
    # jellyfin-server_default: reaches jellyfin-ts:8096 (jellyfin's net namespace)
    # by name for user creation/reset — robust against host LAN IP changes.
    # No published ports — only Caddy (also on these networks) talks to it.
    networks:
      - media-automation
      - jellyfin-server_default

  # Internal audio downloader for the "Música" feature. Holds its own
  # JELLYFIN_API_KEY (music library scans + ensure), searches YouTube Music
  # (ytmusicapi), downloads with yt-dlp, and writes m4a into the shared media
  # volume under /media/Music so Jellyfin picks them up. No published ports —
  # only the BFF (on media-automation) reaches it, and the BFF authenticates
  # every caller against their Jellyseerr session first. Runs as PUID/PGID so
  # written files are readable by Jellyfin (same media volume).
  music-worker:
    build: ./music-worker
    container_name: poisonflix-music-worker
    restart: always
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # Without these the worker still starts, still answers, and still returns
      # a radio — just never a personalised one. Every Jellyfin call 401s, so
      # the videoId index comes back empty, no library track ever resolves to a
      # seed, and every "Porque escuchaste X" row silently collapses to the same
      # generic feed. The code has read them since it was written; the compose
      # never passed them.
      JELLYFIN_URL: ${JELLYFIN_URL:?set JELLYFIN_URL in infra/.env}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:?set JELLYFIN_API_KEY in infra/.env}
    volumes:
      # The shared media disk — the worker writes /media/Music, Jellyfin reads it.
      # Fail loudly on an unset DATA_DIR: compose interpolates blank, mounts the
      # host's /media, and `create_host_path` conjures it into existence, so the
      # worker writes into an empty directory Jellyfin has never heard of and
      # every smoke test still passes.
      - ${DATA_DIR:?set DATA_DIR in infra/.env — host path whose media/ Jellyfin reads}/media:/media
      # Jobs + dedup manifest + yt-dlp cache (best-effort persistence).
      - ./music-worker/data:/data
    networks:
      - media-automation
      - jellyfin-server_default

  # LAN casting for "ver en la tele" — SSDP/mDNS discovery plus the SSAP, DIAL,
  # DLNA and Cast adapters. The BFF proxies to it at /bff/cast/* (see
  # bff/cast.mjs); nothing else in this file talks to it.
  cast-bridge:
    build: ./cast-bridge
    container_name: poisonflix-cast-bridge
    restart: unless-stopped
    # THE reason this service exists as a separate container.
    #
    # Discovery is multicast: an SSDP M-SEARCH to 239.255.255.250:1900 and an
    # mDNS query to 224.0.0.251:5353. From a bridge network those datagrams
    # never leave the namespace, and a TV that did hear one would have nowhere
    # to send its unicast reply back to. Measured, not assumed: 0 devices from a
    # bridge network, the TV from host networking. No `ports:` mapping fixes it,
    # because the problem is not inbound ports — it is that the container is not
    # on the LAN at all. So the discovery moves to a container that is, and the
    # BFF (which must stay on the *arr networks) proxies to it.
    #
    # `network_mode: host` is MUTUALLY EXCLUSIVE with `networks:` — compose
    # refuses the file outright if both appear. That is why there is no
    # `networks:` key here, why cast-bridge has no name on media-automation, and
    # why the BFF above dials a gateway IP instead of `http://cast-bridge:8791`.
    # Adding this container to a network to "tidy that up" does not tidy
    # anything: it breaks discovery, which is the entire feature.
    network_mode: host
    # Every other service in this file publishes no ports at all, because only
    # Caddy is supposed to reach them. This one is the exception, and host
    # networking gives it no choice: a host-networked process listens on the
    # host's stack directly.
    #
    # The mitigation is the bind address. CAST_BRIDGE_BIND is the docker gateway
    # — the host's address on the bridge network — and NOT 0.0.0.0. On 0.0.0.0
    # this service would be answering on the LAN interface and the tailnet, in
    # front of no Caddy and no session check, letting anyone who can reach the
    # host enumerate the owner's devices and start playback on their television.
    #
    # Measured, so the claim stays honest rather than flattering: bound to the
    # gateway, the LAN address and the tailnet address both REFUSE the
    # connection — that is the part that matters and it holds. What it does NOT
    # narrow the surface to is "only the BFF": every container on every bridge
    # of this host can route to a gateway address, so radarr, sonarr, prowlarr,
    # jellyseerr, qbittorrent and flaresolverr can all reach it too. That is the
    # same trust boundary those services already share, but it is a boundary,
    # not a wall — and it is why the BFF must not follow redirects from this
    # port either (see bff/cast.mjs).
    #
    # Same variable as CAST_BRIDGE_URL above, on purpose: the address the bridge
    # listens on and the address the BFF dials are one setting, not two.
    environment:
      CAST_BRIDGE_BIND: ${CAST_GATEWAY_IP:-172.19.0.1}
      CAST_BRIDGE_PORT: 8791
      CAST_DATA_DIR: /data
    volumes:
      # The webOS pairing keys. An LG TV hands out a client-key ONCE, on the
      # first connection, while showing a confirmation dialog on screen; losing
      # this directory means every restart puts that dialog back in front of
      # whoever is trying to watch something. Persistence here is the difference
      # between pairing once and pairing forever.
      - ./cast-bridge/data:/data
    # No `depends_on` in either direction, and the BFF does not wait for this.
    # Casting is optional: bff/cast.mjs answers `{ devices: [] }` with a 200 when
    # the bridge is missing, unreachable or still booting, precisely so an
    # optional feature can never keep the player screen — or the whole BFF —
    # from working. This service already has the scar where an optional
    # feature's missing folder refused to boot auth, música, jam and all three
    # *arr proxies (see the games mount above).

  # Public entry point over Tailscale Funnel. Userspace mode (no NET_ADMIN, no
  # kernel iptables) reverse-proxies the tailnet HTTPS domain to the Caddy proxy.
  # First-run setup + enabling Funnel is interactive — see infra/tailscale/README.md.
  tailscale:
    image: tailscale/tailscale:latest
    container_name: poisonflix-ts
    hostname: poisonflix # -> https://poisonflix.<your-tailnet>.ts.net
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_USERSPACE=true
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./tailscale/serve.json:/config/serve.json:ro
      - poisonflix-ts-state:/var/lib/tailscale
    networks:
      - jellyfin-server_default
      - media-automation

volumes:
  poisonflix-ts-state:

networks:
  jellyfin-server_default:
    external: true
  media-automation:
    external: true
