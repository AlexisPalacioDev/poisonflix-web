# poisonflix-web infra. The Caddy proxy is the single public entry point; the BFF
# is the only component that holds the *arr API keys and the only upstream the
# /prowlarr /radarr /sonarr /bff routes reach (see Caddyfile + bff/server.mjs).
services:
  caddy:
    image: caddy:2-alpine
    container_name: poisonflix-proxy
    restart: unless-stopped
    ports:
      - "8600:8600"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # ./www is the built web app (git-ignored build output). Regenerate it with:
      #   npm run build && rm -rf infra/www && cp -r dist infra/www
      - ./www:/srv:ro
      # ./updates hosts the native APK self-update channel (version.json + apk),
      # served at /updates/*. Published by poisonflix's release.sh.
      - ./updates:/updates:ro
    networks:
      - jellyfin-server_default
      - media-automation
    depends_on:
      - bff

  # Auth-aware backend-for-frontend. Validates the caller's Jellyseerr session and
  # injects each *arr's X-Api-Key server-side, so no credential reaches the browser.
  bff:
    build: ./bff
    container_name: poisonflix-bff
    restart: unless-stopped
    # Real API keys + upstream URLs. Copy infra/env.example -> infra/.env first.
    env_file:
      - .env
    # MUSIC_WORKER_URL is a fixed internal address (not a secret), so it lives
    # here rather than in .env; the override merges the secret env on top.
    environment:
      MUSIC_WORKER_URL: http://music-worker:8790
    # Persists invite codes for self-service registration (see bff/invites.mjs).
    volumes:
      - ./bff/data:/data
    # media-automation: reaches jellyseerr/radarr/sonarr/prowlarr by name.
    # jellyfin-server_default: reaches jellyfin-ts:8096 (jellyfin's net namespace)
    # by name for user creation/reset — robust against host LAN IP changes.
    # No published ports — only Caddy (also on these networks) talks to it.
    networks:
      - media-automation
      - jellyfin-server_default

  # Internal audio downloader for the "Música" feature. Holds its own
  # JELLYFIN_API_KEY (music library scans + ensure), searches YouTube Music
  # (ytmusicapi), downloads with yt-dlp, and writes m4a into the shared media
  # volume under /media/Music so Jellyfin picks them up. No published ports —
  # only the BFF (on media-automation) reaches it, and the BFF authenticates
  # every caller against their Jellyseerr session first. Runs as PUID/PGID so
  # written files are readable by Jellyfin (same media volume).
  music-worker:
    build: ./music-worker
    container_name: poisonflix-music-worker
    restart: always
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # Without these the worker still starts, still answers, and still returns
      # a radio — just never a personalised one. Every Jellyfin call 401s, so
      # the videoId index comes back empty, no library track ever resolves to a
      # seed, and every "Porque escuchaste X" row silently collapses to the same
      # generic feed. The code has read them since it was written; the compose
      # never passed them.
      JELLYFIN_URL: ${JELLYFIN_URL:?set JELLYFIN_URL in infra/.env}
      JELLYFIN_API_KEY: ${JELLYFIN_API_KEY:?set JELLYFIN_API_KEY in infra/.env}
    volumes:
      # The shared media disk — the worker writes /media/Music, Jellyfin reads it.
      # Fail loudly on an unset DATA_DIR: compose interpolates blank, mounts the
      # host's /media, and `create_host_path` conjures it into existence, so the
      # worker writes into an empty directory Jellyfin has never heard of and
      # every smoke test still passes.
      - ${DATA_DIR:?set DATA_DIR in infra/.env — host path whose media/ Jellyfin reads}/media:/media
      # Jobs + dedup manifest + yt-dlp cache (best-effort persistence).
      - ./music-worker/data:/data
    networks:
      - media-automation
      - jellyfin-server_default

  # Public entry point over Tailscale Funnel. Userspace mode (no NET_ADMIN, no
  # kernel iptables) reverse-proxies the tailnet HTTPS domain to the Caddy proxy.
  # First-run setup + enabling Funnel is interactive — see infra/tailscale/README.md.
  tailscale:
    image: tailscale/tailscale:latest
    container_name: poisonflix-ts
    hostname: poisonflix # -> https://poisonflix.<your-tailnet>.ts.net
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_USERSPACE=true
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./tailscale/serve.json:/config/serve.json:ro
      - poisonflix-ts-state:/var/lib/tailscale
    networks:
      - jellyfin-server_default
      - media-automation

volumes:
  poisonflix-ts-state:

networks:
  jellyfin-server_default:
    external: true
  media-automation:
    external: true
